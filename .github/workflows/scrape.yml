name: Daily Japanese lessons
on:
  schedule:
    - cron: '0 16 * * *' # 01:00 Asia/Seoul the following day
  workflow_dispatch:
    inputs:
      sync_only:
        description: 'Synchronize existing completed lessons to Firebase without discovering articles'
        type: boolean
        default: false
permissions:
  contents: write
  id-token: write
concurrency:
  group: japanese-archive-writer
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: google-github-actions/auth@v3
        id: firebase_auth
        with:
          project_id: jlpt-practice-20a4e
          workload_identity_provider: projects/218704881410/locations/global/workloadIdentityPools/japanese-scraper/providers/github
          service_account: japanese-lesson-sync@jlpt-practice-20a4e.iam.gserviceaccount.com
      - run: python -m pip install -r requirements.txt
      - name: Discover archive without transcription
        if: ${{ inputs.sync_only != true }}
        run: python -m scraper.cli --discover-only
      - name: Organize lesson notes
        if: ${{ always() && steps.firebase_auth.outcome == 'success' }}
        run: python -m scraper.lesson_notes
      - name: Save validated lessons to Firebase
        id: firebase_sync
        if: ${{ always() && steps.firebase_auth.outcome == 'success' }}
        run: python -m scraper.firebase_sync
      - name: Save discovered archive
        id: save
        if: ${{ always() }}
        run: |
          git config user.name 'Japanese archive bot'
          git config user.email 'archive-bot@users.noreply.github.com'
          git add data/articles.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Japanese lesson archive'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
